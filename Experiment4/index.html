<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 50px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Student Grade Calculator</h2>

        <button onclick="calculateResult()">
            Enter Marks
        </button>

        <div id="result"></div>
    </div>

    <script>

        function calculateResult() {

            let subjects = parseInt(prompt("Enter number of subjects:"));

            let total = 0;

            // Loop to enter marks
            for (let i = 1; i <= subjects; i++) {

                let marks = parseFloat(
                    prompt("Enter marks for Subject " + i + ":")
                );

                total += marks;
            }

            let average = total / subjects;

            let grade;
            let result;

            // Conditional Statements
            if (average >= 90) {
                grade = "A+";
            }
            else if (average >= 80) {
                grade = "A";
            }
            else if (average >= 70) {
                grade = "B";
            }
            else if (average >= 60) {
                grade = "C";
            }
            else if (average >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            if (average >= 40) {
                result = "Pass";
            } else {
                result = "Fail";
            }

            document.getElementById("result").innerHTML =
                "<p>Total Marks: " + total + "</p>" +
                "<p>Average Marks: " + average.toFixed(2) + "</p>" +
                "<p>Grade: " + grade + "</p>" +
                "<p>Result: " + result + "</p>";
        }

    </script>

</body>
</html>
